<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasmania Live Clock – OBS Overlay</title>
  <style>
    :root {
      --text-colour: #ffffff;
      --panel-colour: rgba(0, 0, 0, 0.65);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    #clock-panel {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3px;
      padding: 14px 22px;
      border-radius: 18px 0 0 0;
      background: var(--panel-colour);
      color: var(--text-colour);
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    #time {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
    }

    #date {
      font-size: 21px;
      font-weight: 500;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="clock-panel" aria-label="Current date and time in Tasmania">
    <div id="time">--:-- --</div>
    <div id="date">Loading Tasmania date…</div>
  </div>

  <script>
    // Australia/Hobart automatically switches between AEST and AEDT.
    const TIME_ZONE = "Australia/Hobart";
    const WEEKDAYS = {
      Sunday: "Sun", Monday: "Mon", Tuesday: "Tues", Wednesday: "Wed",
      Thursday: "Thurs", Friday: "Fri", Saturday: "Sat"
    };

    const timeFormatter = new Intl.DateTimeFormat("en-AU", {
      timeZone: TIME_ZONE,
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    });
    const weekdayFormatter = new Intl.DateTimeFormat("en-AU", {
      timeZone: TIME_ZONE,
      weekday: "long"
    });
    const dateFormatter = new Intl.DateTimeFormat("en-AU", {
      timeZone: TIME_ZONE,
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });

    function updateClock() {
      const now = new Date();
      const timeParts = timeFormatter.formatToParts(now);
      const get = (type) => timeParts.find(part => part.type === type)?.value || "";
      document.getElementById("time").textContent =
        `${get("hour")}:${get("minute")} ${get("dayPeriod").toLowerCase()}`;

      const weekday = WEEKDAYS[weekdayFormatter.format(now)];
      document.getElementById("date").textContent =
        `${weekday}, ${dateFormatter.format(now)}`;
    }

    updateClock();
    setInterval(updateClock, 250);
  </script>
</body>
</html>
